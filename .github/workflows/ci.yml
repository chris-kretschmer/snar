name: CI

on:
  push:
  pull_request:

# The token only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit (the comment names the release); Dependabot keeps them current.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check all source files
        run: |
          for f in src/*.js public/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Tests
        run: npm test

      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

      # A plain syntax check misses runtime errors (broken require()s,
      # failed DB migrations on startup, etc.) - so also actually start
      # the server and poll /healthz.
      - name: Boot smoke test (server starts, /healthz responds)
        env:
          ADMIN_USER: admin
          ADMIN_PASSWORD: ci-smoke-test-password
          BASE_URL: https://example.com
          PORT: 3000
          DATA_DIR: ${{ runner.temp }}/snar-ci-data
        run: |
          node src/server.js &
          SERVER_PID=$!
          echo "Waiting for /healthz..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/healthz > /dev/null; then
              echo "Server is reachable."
              kill "$SERVER_PID"
              exit 0
            fi
            sleep 0.5
          done
          echo "Server did not respond in time."
          kill "$SERVER_PID" 2>/dev/null || true
          exit 1

      - name: Docker image builds
        run: docker build -t snar-ci .
